[project]
name = "rag-fcup"
version = "0.1.0"
description = "Local RAG chatbot for FCUP students (RGPD compliant)"
requires-python = ">=3.10"

dependencies = [
    # ─── RAG & LLM ───────────────────────────────────────────────────────────
    "llama-index>=0.11",
    "llama-index-vector-stores-qdrant>=0.4",
    "llama-index-llms-ollama>=0.4",
    "llama-index-embeddings-ollama>=0.4",
    "qdrant-client>=1.11",

    # ─── Scraping ────────────────────────────────────────────────────────────
    "playwright>=1.48",
    "beautifulsoup4>=4.12",
    "httpx>=0.27",

    # ─── Backend ─────────────────────────────────────────────────────────────
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "python-jose[cryptography]>=3.3",
    "aiosmtplib>=3.0",
    "python-dotenv>=1.0",
    "email-validator>=2.2",

    # ─── Frontend ────────────────────────────────────────────────────────────
    "chainlit>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",      # for FastAPI TestClient
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["scraper", "rag", "api", "frontend"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
